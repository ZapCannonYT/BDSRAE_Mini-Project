[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxidrift"
version = "0.1.0"
description = "Concept drift detection on NYC taxi demand streams (Kafka + Spark), with drift-triggered retraining and borough fairness analysis."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Rahul Saran Sharma" },
    { name = "Rahul Prasanna" },
    { name = "Raghav U" },
]
# Pinned so the Docker image, CI and laptops all run the same versions.
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "pyarrow==15.0.2",
    "pyspark==4.0.1",
    "confluent-kafka==2.4.0",
    "lightgbm==4.3.0",
    "scikit-learn==1.4.2",
    "river==0.21.1",
    "mlflow==2.13.0",
    "setuptools<80",  # mlflow 2.13 imports pkg_resources
    "holidays==0.50",
    "pyyaml==6.0.1",
    "requests==2.32.3",
    "matplotlib==3.8.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.1",
    "jupyterlab==4.2.1",
    "ruff==0.4.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
