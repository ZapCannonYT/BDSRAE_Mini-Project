# Infrastructure:   docker compose up -d
# Full pipeline:    docker compose --profile pipeline up -d
# More workers:     docker compose up -d --scale spark-worker=4

x-app: &app
  build: .
  image: taxidrift:latest
  volumes:
    - ./data:/app/data
    - ./results:/app/results
    - ./src:/app/src
    - ./configs:/app/configs
    - ./experiments:/app/experiments
    - ./notebooks:/app/notebooks
  env_file:
    - path: .env
      required: false

services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 4
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  spark-master:
    <<: *app
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:7077:7077"

  spark-worker:
    <<: *app
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
    depends_on:
      - spark-master

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts --artifacts-destination /mlflow/artifacts
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./mlflow:/mlflow

  jupyter:
    <<: *app
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root",
              "--IdentityProvider.token=", "--notebook-dir=/app"]
    ports:
      - "127.0.0.1:8888:8888"

  # ---- pipeline services (profile "pipeline") ----
  producer:
    <<: *app
    profiles: ["pipeline"]
    command: ["python", "-m", "taxidrift.stream.producer"]
    depends_on:
      kafka:
        condition: service_healthy

  aggregator:
    <<: *app
    profiles: ["pipeline"]
    command: ["/opt/spark/bin/spark-submit",
              "--master", "spark://spark-master:7077",
              "--packages", "org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.1",
              "--conf", "spark.jars.ivy=/tmp/.ivy",
              "/app/src/taxidrift/stream/aggregator.py"]
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_started

  monitor:
    <<: *app
    profiles: ["pipeline"]
    command: ["python", "-m", "taxidrift.monitor.service"]
    depends_on:
      kafka:
        condition: service_healthy
      mlflow:
        condition: service_started
